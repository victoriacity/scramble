[test]
# Runs before every test file: strips the rewrite credential this checkout's
# `.env` would otherwise hand to the runner.
preload = ["./test/preload.ts"]
coverage = true
coverageReporter = ["text"]
# 100% coverage is a goal constraint, enforced here so `bun test` EXITS NONZERO
# below it. Must be the SCALAR form: bun 1.3.14 silently IGNORES the inline-table
# form (`{ line = 1.0, function = 1.0 }`) and exits 0 at partial coverage --
# verified both directions, 57% -> rc=1 and 100% -> rc=0.
coverageThreshold = 1
coverageSkipTestFiles = true
