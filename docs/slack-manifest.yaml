# scramble Slack app manifest.
# One internal app runs the whole bridge: the persona tier posts each agent's
# messages under that agent's name/avatar via chat:write.customize, and a
# per-agent bot token upgrades that agent to a real user (optional).

api_information:
  name: scramble

features:
  bot_user:
    display_name: scramble
    always_online: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      # Public channel history + messages.
      - channels:history
      # PRIVATE channel history + messages. Slack gates private channels behind
      # their own scope and event: without these two, a private channel the bot
      # sits in is silent. An app installed before these were added must be
      # updated AND REINSTALLED for the new scope to take effect.
      - groups:history
      - im:history

event_subscriptions:
  bot_events:
    - message.channels
    - message.groups
    - message.im

settings:
  socket_mode_enabled: true
  token_rotation_enabled: false